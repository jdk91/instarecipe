name: Code check

on: [push]

jobs:
  Run-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install .

      - name: Run Pylint
        run: |
          PYTHONPATH=src pylint src/ --exit-zero
