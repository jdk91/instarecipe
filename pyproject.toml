[project]
name = "instarecipe"
version = "0.1.0"
description = "Dependencies for my project"
readme = "README.md"
]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.2",
    "instaloader==4.16",
    "protobuf==7.36.2",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "Requests==2.34.2",
    "streamlit==1.66.1"
]

[project.scripts]
instarecipe = "instarecipe:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
